
# ──────────────────────────────────────────────────────────────
# CineFlow – EC2 Production Docker Compose
#
# Services:
# PostgreSQL | Redis | ZooKeeper | Kafka | Spring Boot Backend
# Optional: Prometheus | Grafana
# ──────────────────────────────────────────────────────────────

services:

  # ─────────────────────────────────────────
  # POSTGRESQL — Persistent Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: cineflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cineflow
      POSTGRES_USER: cineflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineflow -d cineflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # REDIS — Caching Layer
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cineflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # ZOOKEEPER — Kafka Coordination
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cineflow-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test:
        - CMD-SHELL
        - cub zk-ready zookeeper:2181 10
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # KAFKA — Event Streaming
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cineflow-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        - CMD
        - kafka-topics
        - --bootstrap-server
        - localhost:9092
        - --list
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # CINEFLOW — Spring Boot Backend
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cineflow-backend:latest
    container_name: cineflow-app
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    environment:

      # Application
      SPRING_APPLICATION_NAME: cineflow

      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cineflow
      SPRING_DATASOURCE_USERNAME: cineflow
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # AWS S3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-south-1}

      # FFmpeg
      FFMPEG_OUTPUT_DIR: /cineflow-temp

      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      # Actuator / Prometheus
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never

    volumes:
      - hls_temp:/cineflow-temp

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/actuator/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────
  # PROMETHEUS — Metrics Collection
  # Optional: Enable for production monitoring
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: cineflow-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      app:
        condition: service_healthy

  # ─────────────────────────────────────────
  # GRAFANA — Metrics Visualization
  # Optional: Enable for production monitoring
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: cineflow-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

# ──────────────────────────────────────────────────────────────
# PERSISTENT VOLUMES
# ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  hls_temp:
  prometheus_data:
  grafana_data:
